<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ev - Creative Portfolio</title>
    <meta name="description" content="Ev's creative portfolio - Art, Code, and Music">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #1a1a1a;
        }

        .heading-font {
            font-family: 'Playfair Display', serif;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Image hover effect */
        .gallery-item {
            overflow: hidden;
            position: relative;
        }

        .gallery-item img {
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon Components
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                {children}
            </svg>
        );

        const Icons = {
            Palette: (props) => (
                <IconBase {...props}>
                    <circle cx="13.5" cy="6.5" r=".5"/>
                    <circle cx="17.5" cy="10.5" r=".5"/>
                    <circle cx="8.5" cy="7.5" r=".5"/>
                    <circle cx="6.5" cy="12.5" r=".5"/>
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
                </IconBase>
            ),
            Code: (props) => (
                <IconBase {...props}>
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </IconBase>
            ),
            Music: (props) => (
                <IconBase {...props}>
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </IconBase>
            ),
            Mail: (props) => (
                <IconBase {...props}>
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </IconBase>
            ),
            Github: (props) => (
                <IconBase {...props}>
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                </IconBase>
            ),
            ExternalLink: (props) => (
                <IconBase {...props}>
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                </IconBase>
            ),
            Menu: (props) => (
                <IconBase {...props}>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </IconBase>
            ),
            X: (props) => (
                <IconBase {...props}>
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </IconBase>
            )
        };

        const { Palette, Code, Music, Mail, Github, ExternalLink, Menu, X } = Icons;

        // Art Gallery Component
        const ArtGallery = () => {
            const artworks = [
                {
                    id: 1,
                    title: "Digital Dreams",
                    medium: "Digital Art",
                    year: "2024",
                    description: "Exploring the intersection of technology and emotion"
                },
                {
                    id: 2,
                    title: "Urban Sketches",
                    medium: "Mixed Media",
                    year: "2023",
                    description: "City life captured through abstract compositions"
                },
                {
                    id: 3,
                    title: "Nature's Palette",
                    medium: "Watercolor",
                    year: "2024",
                    description: "Finding beauty in natural forms and colors"
                },
                {
                    id: 4,
                    title: "Geometric Harmony",
                    medium: "Vector Art",
                    year: "2024",
                    description: "Balance and symmetry in modern design"
                }
            ];

            return (
                <section id="art" className="py-20 px-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex items-center gap-4 mb-12">
                            <Palette className="text-purple-600" size={32} />
                            <h2 className="text-4xl font-bold heading-font">Art Gallery</h2>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {artworks.map((art) => (
                                <div key={art.id} className="gallery-item group bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300">
                                    <div className="aspect-video bg-gradient-to-br from-purple-100 to-pink-100 rounded-t-lg flex items-center justify-center">
                                        <Palette className="text-purple-300" size={64} />
                                    </div>
                                    <div className="p-6">
                                        <h3 className="text-xl font-semibold mb-2">{art.title}</h3>
                                        <p className="text-sm text-gray-500 mb-3">{art.medium} • {art.year}</p>
                                        <p className="text-gray-600">{art.description}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Code Portfolio Component
        const CodePortfolio = () => {
            const projects = [
                {
                    id: 1,
                    title: "Bundle Analyzer",
                    description: "CLI tool for analyzing JavaScript bundle sizes and dependencies",
                    tech: ["Node.js", "JavaScript", "CLI"],
                    link: "/projects/bundle-analyzer"
                },
                {
                    id: 2,
                    title: "Lighthouse Enforcer",
                    description: "Automated performance testing tool for Core Web Vitals",
                    tech: ["Node.js", "Lighthouse", "Automation"],
                    link: "/projects/lighthouse-enforcer"
                },
                {
                    id: 3,
                    title: "OSINT Tools",
                    description: "Client-side intelligence gathering suite",
                    tech: ["JavaScript", "Web APIs", "Security"],
                    link: "/osint.html"
                },
                {
                    id: 4,
                    title: "Portfolio Site",
                    description: "This website - a React-based portfolio",
                    tech: ["React", "Tailwind CSS", "JavaScript"],
                    link: "https://github.com/BobGnarly420/bobgnarly420.github.io"
                }
            ];

            return (
                <section id="code" className="py-20 px-6 bg-gray-50">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex items-center gap-4 mb-12">
                            <Code className="text-blue-600" size={32} />
                            <h2 className="text-4xl font-bold heading-font">Code Projects</h2>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {projects.map((project) => (
                                <div key={project.id} className="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition-shadow duration-300">
                                    <h3 className="text-xl font-semibold mb-3">{project.title}</h3>
                                    <p className="text-gray-600 mb-4">{project.description}</p>
                                    <div className="flex flex-wrap gap-2 mb-4">
                                        {project.tech.map((tech) => (
                                            <span key={tech} className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm">
                                                {tech}
                                            </span>
                                        ))}
                                    </div>
                                    <a
                                        href={project.link}
                                        className="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 font-medium"
                                    >
                                        View Project <ExternalLink size={16} />
                                    </a>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Music Projects Component
        const MusicProjects = () => {
            const tracks = [
                {
                    id: 1,
                    title: "Midnight Dreams",
                    type: "Electronic",
                    year: "2024",
                    description: "Ambient electronic composition exploring nocturnal themes"
                },
                {
                    id: 2,
                    title: "Urban Rhythm",
                    type: "Hip-Hop Beat",
                    year: "2024",
                    description: "City-inspired beat with jazzy undertones"
                },
                {
                    id: 3,
                    title: "Digital Waves",
                    type: "Synthwave",
                    year: "2023",
                    description: "Retro-futuristic synth journey"
                },
                {
                    id: 4,
                    title: "Acoustic Memories",
                    type: "Indie Folk",
                    year: "2023",
                    description: "Intimate guitar-driven storytelling"
                }
            ];

            return (
                <section id="music" className="py-20 px-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex items-center gap-4 mb-12">
                            <Music className="text-pink-600" size={32} />
                            <h2 className="text-4xl font-bold heading-font">Music Projects</h2>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {tracks.map((track) => (
                                <div key={track.id} className="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition-shadow duration-300">
                                    <div className="flex items-start justify-between mb-4">
                                        <div>
                                            <h3 className="text-xl font-semibold mb-1">{track.title}</h3>
                                            <p className="text-sm text-gray-500">{track.type} • {track.year}</p>
                                        </div>
                                        <Music className="text-pink-400" size={24} />
                                    </div>
                                    <p className="text-gray-600 mb-4">{track.description}</p>
                                    <div className="bg-gradient-to-r from-pink-500 to-purple-500 h-1 rounded-full w-full"></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Main App Component
        const App = () => {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            return (
                <div className="min-h-screen bg-white">
                    {/* Header */}
                    <header className="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-sm shadow-sm">
                        <nav className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
                            <a href="#" className="text-2xl font-bold heading-font gradient-text">
                                Ev
                            </a>

                            {/* Desktop Navigation */}
                            <div className="hidden md:flex items-center gap-8">
                                <a href="#art" className="text-gray-700 hover:text-purple-600 transition-colors font-medium">
                                    Art
                                </a>
                                <a href="#code" className="text-gray-700 hover:text-blue-600 transition-colors font-medium">
                                    Code
                                </a>
                                <a href="#music" className="text-gray-700 hover:text-pink-600 transition-colors font-medium">
                                    Music
                                </a>
                                <a href="#contact" className="text-gray-700 hover:text-gray-900 transition-colors font-medium">
                                    Contact
                                </a>
                            </div>

                            {/* Mobile Menu Button */}
                            <button
                                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                className="md:hidden p-2"
                            >
                                {mobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                            </button>
                        </nav>

                        {/* Mobile Menu */}
                        {mobileMenuOpen && (
                            <div className="md:hidden bg-white border-t border-gray-200">
                                <div className="px-6 py-4 flex flex-col gap-4">
                                    <a href="#art" onClick={() => setMobileMenuOpen(false)} className="text-gray-700 hover:text-purple-600 font-medium">
                                        Art
                                    </a>
                                    <a href="#code" onClick={() => setMobileMenuOpen(false)} className="text-gray-700 hover:text-blue-600 font-medium">
                                        Code
                                    </a>
                                    <a href="#music" onClick={() => setMobileMenuOpen(false)} className="text-gray-700 hover:text-pink-600 font-medium">
                                        Music
                                    </a>
                                    <a href="#contact" onClick={() => setMobileMenuOpen(false)} className="text-gray-700 hover:text-gray-900 font-medium">
                                        Contact
                                    </a>
                                </div>
                            </div>
                        )}
                    </header>

                    {/* Hero Section */}
                    <section className="pt-32 pb-20 px-6">
                        <div className="max-w-6xl mx-auto text-center">
                            <h1 className="text-5xl md:text-7xl font-bold heading-font mb-6 gradient-text">
                                Creative Portfolio
                            </h1>
                            <p className="text-xl md:text-2xl text-gray-600 mb-8 max-w-2xl mx-auto">
                                Artist, Developer, and Music Creator
                            </p>
                            <div className="flex items-center justify-center gap-4">
                                <a
                                    href="#art"
                                    className="px-8 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-full font-medium hover:shadow-lg transition-shadow duration-300"
                                >
                                    Explore My Work
                                </a>
                                <a
                                    href="https://github.com/BobGnarly420"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-8 py-3 border-2 border-gray-300 rounded-full font-medium hover:border-gray-400 transition-colors duration-300 flex items-center gap-2"
                                >
                                    <Github size={20} />
                                    GitHub
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* Main Content */}
                    <ArtGallery />
                    <CodePortfolio />
                    <MusicProjects />

                    {/* Contact Section */}
                    <section id="contact" className="py-20 px-6 bg-gray-50">
                        <div className="max-w-6xl mx-auto text-center">
                            <div className="flex items-center justify-center gap-4 mb-8">
                                <Mail className="text-gray-600" size={32} />
                                <h2 className="text-4xl font-bold heading-font">Get In Touch</h2>
                            </div>
                            <p className="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">
                                Interested in collaborating or want to learn more about my work?
                            </p>
                            <div className="flex items-center justify-center gap-6">
                                <a
                                    href="https://github.com/BobGnarly420"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="flex items-center gap-2 text-gray-700 hover:text-gray-900 transition-colors"
                                >
                                    <Github size={24} />
                                    <span className="font-medium">GitHub</span>
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-8 px-6 bg-white border-t border-gray-200">
                        <div className="max-w-6xl mx-auto text-center text-gray-600">
                            <p>© 2024 Ev. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #0a0a0a;
            color: #e5e5e5;
        }

        .glitch-text {
            position: relative;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(13px, 9999px, 81px, 0); }
            5% { clip: rect(89px, 9999px, 12px, 0); }
            10% { clip: rect(48px, 9999px, 63px, 0); }
            100% { clip: rect(1px, 9999px, 1px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 11px, 0); }
            5% { clip: rect(23px, 9999px, 76px, 0); }
            10% { clip: rect(8px, 9999px, 32px, 0); }
            100% { clip: rect(1px, 9999px, 1px, 0); }
        }

        .scanline {
            width: 100%;
            height: 100px;

            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(51, 255, 0, 0.02) 50%, rgba(0,0,0,0) 100%);

            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;

            background: #0a0a0a;
        }
